name: Release

on:
  release:
    types:
      - published

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-package:
    name: Build verified package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: npm
          node-version: 24
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; console.log(pkg.version)")"
          test "$RELEASE_TAG" = "v$package_version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run test:native
      - name: Build release artifact
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/package-build"
          mkdir "$package_dir"
          npm pack --pack-destination "$package_dir" >/dev/null
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz')
          test "${#packages[@]}" -eq 1
          package_path="${packages[0]}"
          mkdir release-artifact
          cp "$package_path" release-artifact/package.tgz
          (cd release-artifact && sha256sum package.tgz > package.tgz.sha256)
      - name: Upload immutable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: npm-package
          path: release-artifact/
          retention-days: 1

  smoke-package:
    name: Smoke-test exact package
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: none
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Download immutable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package
          path: release-artifact
      - name: Verify artifact digest
        run: cd release-artifact && sha256sum --check package.tgz.sha256
      - name: Install and smoke-test exact artifact
        run: |
          set -euo pipefail
          package_path="$GITHUB_WORKSPACE/release-artifact/package.tgz"
          consumer="$RUNNER_TEMP/release-consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init --yes >/dev/null
          npm config set allow-scripts \
            @tree-sitter-grammars/tree-sitter-markdown,@tree-sitter-grammars/tree-sitter-toml,@tree-sitter-grammars/tree-sitter-yaml,tree-sitter,tree-sitter-c,tree-sitter-c-sharp,tree-sitter-cpp,tree-sitter-elixir,tree-sitter-go,tree-sitter-haskell,tree-sitter-html,tree-sitter-java,tree-sitter-javascript,tree-sitter-json,tree-sitter-php,tree-sitter-python,tree-sitter-ruby,tree-sitter-rust,tree-sitter-scala,tree-sitter-typescript,unrs-resolver \
            --location=project
          npm install "$package_path" --strict-allow-scripts --no-audit --no-fund
          ./node_modules/.bin/shadow-auditor --help
          ./node_modules/.bin/shadow-auditor --version
          ./node_modules/.bin/shadow-auditor shell --help
          node -e 'const Parser = require("tree-sitter"); const TypeScript = require("tree-sitter-typescript").typescript; const parser = new Parser(); parser.setLanguage(TypeScript); if (parser.parse("const value: number = 1").rootNode.hasError) process.exit(1);'
          node -e 'const Parser = require("tree-sitter"); for (const [name, source] of [["toml", "enabled = true"], ["yaml", "enabled: true"]]) { const grammar = require("@tree-sitter-grammars/tree-sitter-" + name); const parser = new Parser(); parser.setLanguage(grammar); if (parser.parse(source).rootNode.hasError) process.exit(1); }'

  publish:
    name: Publish verified package
    needs:
      - build-package
      - smoke-package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package
          path: release-artifact
      - name: Verify artifact digest
        run: cd release-artifact && sha256sum --check package.tgz.sha256
      - name: Verify package identity and registry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/package.json"
          tar --extract --to-stdout --file release-artifact/package.tgz package/package.json > "$manifest"
          MANIFEST_PATH="$manifest" node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, "utf8"));
            if (manifest.name !== "shadow-auditor") throw new Error("Unexpected package name.");
            if (`v${manifest.version}` !== process.env.RELEASE_TAG) throw new Error("Unexpected package version.");
            if (manifest.publishConfig?.registry) throw new Error("Tarball must not override the npm registry.");
          '
      - name: Publish verified artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-artifact/package.tgz --access public --ignore-scripts --provenance --registry=https://registry.npmjs.org/
