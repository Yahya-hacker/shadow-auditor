name: Release

on:
  release:
    types:
      - published

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NPM_VERSION: 11.16.0

jobs:
  build-package:
    name: Build verified package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          node-version-file: .node-version
      - name: Pin supported npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --ignore-scripts
          test "$(npm --version)" = "$NPM_VERSION"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) throw new Error(`npm ${process.argv[1]} is below the required 11.5.1`);
          ' "$(npm --version)"
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; console.log(pkg.version)")"
          test "$RELEASE_TAG" = "v$package_version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Install locked dependencies
        run: npm ci --strict-allow-scripts
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run release gates
        run: npm run verify
      - name: Build release artifact
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/package-build"
          mkdir "$package_dir"
          npm pack --pack-destination "$package_dir" >/dev/null
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz')
          test "${#packages[@]}" -eq 1
          package_path="${packages[0]}"

          tar --list --file "$package_path" > "$RUNNER_TEMP/package-files.txt"
          grep --fixed-strings --line-regexp package/LICENSE "$RUNNER_TEMP/package-files.txt"
          grep --fixed-strings --line-regexp package/README.md "$RUNNER_TEMP/package-files.txt"

          mkdir release-artifact
          cp "$package_path" release-artifact/package.tgz
          (cd release-artifact && sha256sum package.tgz > package.tgz.sha256)
      - name: Upload immutable artifact
        id: package-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: npm-package
          path: release-artifact/
          retention-days: 1

  smoke-package:
    name: Smoke-test exact package
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: none
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Pin supported npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --ignore-scripts
          test "$(npm --version)" = "$NPM_VERSION"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) throw new Error(`npm ${process.argv[1]} is below the required 11.5.1`);
          ' "$(npm --version)"
      - name: Download immutable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release-artifact
      - name: Verify artifact digest
        run: cd release-artifact && sha256sum --check package.tgz.sha256
      - name: Install and smoke-test exact artifact
        shell: bash
        run: |
          set -euo pipefail
          package_path="$GITHUB_WORKSPACE/release-artifact/package.tgz"
          consumer="$RUNNER_TEMP/release-consumer"
          mkdir "$consumer"
          cd "$consumer"
          node -e '
            const fs = require("node:fs");
            const manifest = {
              name: "shadow-auditor-release-smoke",
              private: true,
              allowScripts: {
                "tree-sitter@0.21.1": true,
                "tree-sitter-go@0.21.2": true,
                "tree-sitter-javascript@0.21.4": true,
                "tree-sitter-javascript@0.23.1": true,
                "tree-sitter-python@0.21.0": true,
                "tree-sitter-typescript@0.23.2": true
              }
            };
            fs.writeFileSync("package.json", JSON.stringify(manifest, null, 2));
          '
          npm install "$package_path" --strict-allow-scripts --no-audit --no-fund
          ./node_modules/.bin/shadow-auditor --help
          ./node_modules/.bin/shadow-auditor --version
          ./node_modules/.bin/shadow-auditor shell --help
          npm explore shadow-auditor -- npm run test:native

  publish:
    name: Publish verified package
    if: github.repository == 'Yahya-hacker/shadow-auditor' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs:
      - build-package
      - smoke-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin supported npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --ignore-scripts
          test "$(npm --version)" = "$NPM_VERSION"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) throw new Error(`npm ${process.argv[1]} is below the required 11.5.1`);
          ' "$(npm --version)"
      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release-artifact
      - name: Verify artifact digest
        run: cd release-artifact && sha256sum --check package.tgz.sha256
      - name: Verify package identity and registry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/package.json"
          tar --extract --to-stdout --file release-artifact/package.tgz package/package.json > "$manifest"
          MANIFEST_PATH="$manifest" node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, "utf8"));
            if (manifest.name !== "shadow-auditor") throw new Error("Unexpected package name.");
            if (`v${manifest.version}` !== process.env.RELEASE_TAG) throw new Error("Unexpected package version.");
            if (manifest.license !== "SEE LICENSE IN LICENSE") throw new Error("Unexpected package license.");
            if (manifest.publishConfig?.registry) throw new Error("Tarball must not override the npm registry.");
          '
      - name: Publish with npm trusted publishing
        run: npm publish release-artifact/package.tgz --access public --ignore-scripts --provenance --registry=https://registry.npmjs.org/
